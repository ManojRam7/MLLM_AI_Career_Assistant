<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { width: 330px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         margin: 0; padding: 14px; color: #111; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 11.5px; margin-bottom: 12px; }
  button { width: 100%; padding: 11px; font-size: 14px; font-weight: 600; border: 0; border-radius: 8px;
           background: #ff4b4b; color: #fff; cursor: pointer; }
  button:hover { background: #e63e3e; }
  button.sec { background: #f1f3f5; color: #222; margin-top: 8px; font-weight: 500; }
  #out { margin-top: 12px; max-height: 320px; overflow-y: auto; }
  .row { padding: 6px 0; border-bottom: 1px solid #eee; }
  .q { color: #555; font-size: 11.5px; }
  .a { font-weight: 600; }
  .miss { color: #b26b00; }
  .ok { color: #0a7d28; font-weight: 600; }
  .warn { background:#fff8e1; border:1px solid #ffe08a; padding:8px; border-radius:6px; font-size:11.5px; }
</style>
</head>
<body>
  <h1>Fill this application</h1>
  <div class="sub">Uses your saved profile. Review everything before you submit.</div>
  <button id="fill">⚡ Fill the form</button>
  <button id="copy" class="sec">📋 Copy answer sheet</button>
  <div id="out"></div>
  <script src="popup.js"></script>
</body>
</html>

    - "senior data scientist"
    - "marketing data scientist"
    - "marketing scientist"
    - "marketing mix modelling"
    - "marketing science"
    - "associate data scientist"
    - "junior data scientist"
    - "graduate data scientist"
    - "applied scientist"
    # --- category 2: AI ENGINEER ---
    - "AI engineer"
    - "machine learning engineer"
    - "LLM engineer"
    - "generative AI engineer"
    - "NLP engineer"
    - "MLOps engineer"
    - "AI/ML engineer"
    # --- category 3: DATA ANALYSIS ---
    - "data analyst"
    - "senior data analyst"
    - "lead data analyst"
    - "data analytics"
    - "analytics engineer"
    - "business intelligence analyst"
    - "insight analyst"
    - "data science analyst"
  locations: ["United Kingdom", "London", "Birmingham", "Manchester", "Edinburgh",
              "Glasgow", "Leeds", "Bristol", "Remote UK"]
  recency_days_recurring: 7      # rolling week window so nothing recent is missed between runs
  recency_days_first: 21         # first run backfills 3 weeks
  max_per_source: 300            # pull deeper from each free API (Reed/Adzuna) so Reed contributes more
  max_job_age_days: 60           # drop jobs posted more than this many days ago (expired postings)
  require_bucket: false           # strict: keep ONLY jobs from your 750 target companies (max focus)
  global_search: true            # v2 GLOBAL: keep non-UK roles and RANK by geo_score (UK>EU>world +
                                 # visa sponsorship) instead of hard-dropping them. false = UK-only.
  intl_visa_mode: "all"          # INTERNATIONAL GATE (replaces intl_visa_strict):
                                 #   "all"    keep every non-UK role EXCEPT ones that explicitly say
                                 #            "no sponsorship" — ranking still puts sponsors first.
                                 #   "likely" only sponsors + likely sponsors (known sponsor employer,
                                 #            or a country with a standard skilled-migration route).
                                 #   "strict" only roles that explicitly advertise sponsorship.
                                 # NOTE: "strict" previously deleted ~every international job at ingest,
                                 # because snippet adverts rarely mention a visa — which left the
                                 # International section permanently empty. "all" is the sane default.
  intl_visa_strict: false        # legacy flag, kept for back-compat (only used if intl_visa_mode unset)


scoring:
  tailor_threshold: 70           # only tailor a CV when fit score >= this (saves tokens)
  shortlist_threshold: 60
  max_score_per_run: 300         # DeepSeek cheap+batched; the daily all-list run finds more, so clear backlog fast
  broad_market_min_fit: 0        # 0 = KEEP everything (accumulate / look-back); jobs never auto-deleted.
                                 # Surface top companies with the '⭐ top list' toggle instead of deleting.
                                 # Set e.g. 60 to auto-remove non-bucket jobs scored below that.
  score_batch_size: 8            # jobs scored per LLM call (fewer calls + tokens; clears backlog faster)
  max_tailor_per_run: 8          # Gemini via Google AI Pro has expanded limits, so tailor a few more per run
  verify_threshold: 70           # two-model consensus: re-check DeepSeek picks >= this with Gemini (0 = off)

notify:
  min_fit: 75                    # only send a Telegram alert for jobs at/above this fit
  max_per_run: 10                # cap Telegram messages per run (avoid spam)
  heartbeat: true                # send a short 'run complete' message each run (set false once confirmed working)
  top_gov_only: true             # alerts ONLY for top employers (data/notify_companies.txt) + government
  companies_file: "data/notify_companies.txt"   # curated top-employer allowlist (edit freely)
  gov_sectors: ["Government & Public Sector"]   # sectors treated as government (always alert-worthy)

sources:
  reed: { enabled: true }
  adzuna: { enabled: true, country: "gb" }
  ats: { enabled: true }         # Greenhouse/Lever/Ashby/SmartRecruiters/Workday/Workable/Recruitee/Eightfold
  brightdata:                    # Google job search via Bright Data SERP API (main engine)
    enabled: true
    country: "gb"
    pages: 2                     # SERP pages per query - deeper coverage (pay-as-you-go, credits no longer capped)
    search_domains:              # broad queries: LinkedIn + all major UK boards ("overall Google" sweep)
      - "uk.linkedin.com/jobs"
      - "www.reed.co.uk/jobs"
      - "www.totaljobs.com"
      - "www.cv-library.co.uk"
      - "uk.indeed.com"
    top_companies_per_run: 5     # rotating per-company sample for the active sector (DS + DA each)
    company_batch: 5             # careers-sites grouped per Google query (higher = fewer credits, less depth)
    max_queries: 40              # broad market queries (pay-as-you-go, so cover more of the market)
    gov_queries: ["data analyst", "data scientist", "data engineer"]
    civil_service_sectors: ["Government & Public Sector"]   # civilservicejobs site: queries on this sector's run
    nhs_sectors: ["Insurance, Health & Pharma"]             # jobs.nhs.uk site: queries on this sector's run
    linkedin_site: false         # set true to add site:uk.linkedin.com/jobs queries on the broad run
    extra_queries:               # broad market queries (3 categories) - run on the daily full/broad run
      # data science
      - "data scientist United Kingdom"
      - "graduate data scientist United Kingdom"
      # ai engineer
      - "AI engineer United Kingdom"
      - "machine learning engineer United Kingdom"
      - "LLM engineer United Kingdom"
      - "generative AI engineer United Kingdom"
      # data analysis
      - "data analyst United Kingdom"
      - "analytics engineer United Kingdom"
      - "business intelligence analyst United Kingdom"
  apify_linkedin:                # cheap STRUCTURED LinkedIn via Apify, filtered by companyName (per-company)
    enabled: false               # OFF - Apify free credits expire after ~12 runs and paid plans are costly.
                                 # We cover companies for free via the expanded ATS layer (careers-page classifier)
                                 # + Bright Data SERP for custom/anti-bot sites. Flip true only to A/B test Apify.
    actor: "valig~linkedin-jobs-scraper"
    title_queries:
      - "data scientist OR machine learning engineer OR AI engineer"
      - "data analyst OR analytics engineer OR business intelligence analyst"
    location: "United Kingdom"
    date_posted: "r604800"       # past 7 days (freshness)
    batch_size: 40               # companies per actor run (LinkedIn companyName filter)
    max_jobs_per_company: 6
    max_batches: 8               # cap actor runs per pipeline run (credit control)
  linkedin:                      # STRUCTURED LinkedIn Jobs via Bright Data Web Scraper API.
    enabled: false               # OFF - the BD Web Scraper product needs account activation ('Customer is
                                 # not active'). Using SERP for LinkedIn instead (works well: 72 top cos/run).
                                 # Flip true only after activating the LinkedIn dataset in Bright Data.
    keywords: ["data scientist", "marketing data scientist", "data analyst", "senior data analyst",
               "analytics engineer", "machine learning engineer", "AI engineer"]
    location: "United Kingdom"
    country: "GB"
    time_range: "Past month"     # freshness (fewer, fresher records = lower cost)
    max_age_days: 30
    max_wait: 480                # seconds to wait for the async scrape (poll)
  indeed:                        # STRUCTURED Indeed Jobs via Bright Data Web Scraper API.
    enabled: false               # OFF - needs BD Web Scraper activation; Indeed now covered via SERP
                                 # (site:uk.indeed.com in search_domains). Flip true after activating the dataset.
    keywords: ["data scientist", "marketing data scientist", "data analyst", "senior data analyst",
               "analytics engineer", "machine learning engineer", "AI engineer"]
    location: "United Kingdom"
    country: "GB"
    domain: "indeed.co.uk"
    date_posted: "Last 7 days"
    max_age_days: 30
    max_wait: 480

cleanup:                         # one-time / ongoing housekeeping, runs every pass (idempotent)
  purge_sources: ["Apify"]       # delete rows from retired sources (old 'Google (Apify)' rows)

bucket_list:
  path: "data/companies_master.csv"       # 1165 target companies across 7 sectors (Master List)

rotation:                        # one sector per scheduled run; all 7 covered once/day with time gaps
  enabled: true
  sectors:                       # the 7 Master-List sectors (the daily run covers ALL of them at once)
    - "Financial Services"
    - "Technology & Telecoms"
    - "Consulting & IT Services"
    - "Retail, Consumer & Media"
    - "Insurance, Health & Pharma"
    - "Energy, Transport & Industrial"
    - "Government & Public Sector"
  schedule_hours_utc: [7, 9, 11, 13, 15, 17, 19]   # `--sector auto` maps the current UTC hour -> sector
  broad_hour_utc: 5              # a dedicated daily FULL/broad run (all sources, no sector focus) at this hour
  broad_on_index: -1             # -1 = no sector run does the broad sweep (only the dedicated full run does)

llm:
  # Tier reality: DeepSeek = paid credits (cheap, bulk scoring); Gemini = Google AI Pro
  # plan (expanded AI Studio API limits, quality tailoring); Groq = free fallback.
  primary: "gemini"              # general fallback provider
  critic: ""                     # "" = off (saves ~half the calls)
  # Per-task routing (parallel model usage). Each task falls back through the
  # others if its provider has no key or errors.
  score_provider: "deepseek"     # high-volume fit-scoring: cheap paid credits, strong, high limits
  score_model: "deepseek-chat"
  tailor_provider: "gemini"      # quality CV tailoring: best instruction-following (AI Pro expanded limits)
  tailor_model: "gemini-2.5-pro"
  gemini_model: "gemini-2.0-flash"   # default/fallback Gemini model (higher limits)
  groq_model: "llama-3.3-70b-versatile"
  deepseek_model: "deepseek-chat"
  request_delay_seconds: 2.5     # scoring runs on DeepSeek; Gemini recommendations have AI Pro expanded limits

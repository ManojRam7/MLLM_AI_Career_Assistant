scoring:
  tailor_threshold: 25           # generate the deep ATS recommendation for fit >= 25 (covers 25-100)
  shortlist_threshold: 60
  max_score_per_run: 300         # DeepSeek cheap+batched; the daily all-list run finds more, so clear backlog fast
  broad_market_min_fit: 0        # 0 = KEEP everything (accumulate / look-back); jobs never auto-deleted.
                                 # Surface top companies with the '⭐ top list' toggle instead of deleting.
                                 # Set e.g. 60 to auto-remove non-bucket jobs scored below that.
  score_batch_size: 8            # jobs scored per LLM call (fewer calls + tokens; clears backlog faster)
  max_tailor_per_run: 15         # deep ATS recommendations generated per run (premium models)
  verify_threshold: 70           # two-model consensus: re-check DeepSeek picks >= this with Gemini (0 = off)
  # LAYERED FIT-SCORE (3 models) — the anti-false-negative net (never trap a good job at a low fit):
  # DeepSeek scores all -> GPT-5.6-sol re-checks everything under l2 -> Gemini 2.5 Pro re-checks any
  # still under l3. Keep the HIGHER score. (Rescue model/provider set in the `llm:` block below.)
  guard_important: true          # master on/off for the layered re-check
  rescue_l2_threshold: 85        # Layer 2 (GPT-5.6-sol) re-checks EVERY job DeepSeek scored below this
  rescue_l3_threshold: 60        # Layer 3 (Gemini 2.5 Pro) re-checks any still below this
  max_rescue_per_run: 300        # cap on jobs escalated per chunk (important/bucket jobs first)

apply:                           # Phase-1 auto-apply (direct-employer ATS only; never Indeed/LinkedIn)
  enabled: true
  threshold: 85                  # only queue jobs scored >= this for auto-apply
  cv_dir: "data/cvs"             # the 9 role CVs (chosen per job by cv_match, never tailored)
  pause_before_submit: true      # (kept) manual review flow when auto_submit is false
  auto_submit: false             # true = the AI fills EVERYTHING and clicks Submit; false = fills + pauses
                                 # (override per run with --submit). Start false, watch it, then flip true.
  answers:                       # your standard application answers — the AI form-filler uses these to
                                 # answer dropdowns / radios / custom questions AS you. Edit freely.
    right_to_work: "I have a Graduate Visa (eligible to work in the UK now without sponsorship)"
    needs_sponsorship_uk: "No"
    coding_language: "Python"
    notice_period: "1 month"
    ideal_start_date: "Within 1 month of an offer"
    salary_expectation_gbp: "45000"
    willing_to_relocate: "Yes"
    current_company: "Tahir Group"
    years_experience: "4+"
    heard_about_role: "LinkedIn"
    gender: "Male"
    ethnicity: "Asian"
    age_bracket: "25-29"
    disability: "No"
    consent: "Yes"

notify:
  # 2.0: every run sends a detailed REPORT card + the best jobs by importance (top100 > bucket >
  # fit > recency), each with the CV keywords to add. Best-of is always surfaced (no hard 75 gate).
  min_fit_floor: 0               # never suppress a good pick purely on score (0 = off)
  max_per_run: 12                # best jobs sent to Telegram per run
  fresh_days: 3                  # prefer jobs first seen in the last N days; auto-widens if none fresh
  heartbeat: true                # (the report card is always sent)
  top_gov_only: false            # false = always show the best-of; true = narrow to top employers + gov
  companies_file: "data/notify_companies.txt"   # curated top-employer allowlist (edit freely)
  gov_sectors: ["Government & Public Sector"]   # sectors treated as government (always alert-worthy)
  min_fit: 75                    # legacy: used by the local digest file + older callers

sources:
  reed: { enabled: true }
  adzuna:                        # multi-country when search.global_search is true (UK first, then EU, then world)
    enabled: true
    country: "gb"                # PRIMARY country (runs ALL queries; others run the first N core queries)
    max_queries_per_country: 5   # credit control: non-primary countries only run this many core queries
    countries:                   # UK first, then the user's EU priority-1 + priority-2 that Adzuna
                                 # supports. (Ireland/Denmark/Sweden/Finland/Norway/Luxembourg/Japan/
                                 # Korea/UAE have no Adzuna endpoint -> covered by the LinkedIn SERP below.)
      - "gb"                     # United Kingdom
      - "de"                     # Germany (EU p1)
      - "nl"                     # Netherlands
      - "at"                     # Austria
      - "fr"                     # France
      - "ch"                     # Switzerland
      - "be"                     # Belgium
      - "ca"                     # Canada (p2)
      - "au"                     # Australia
      - "nz"                     # New Zealand
      - "sg"                     # Singapore
  ats: { enabled: true }         # Greenhouse/Lever/Ashby/SmartRecruiters/Workday/Workable/Recruitee/Eightfold
  brightdata:                    # Google job search via Bright Data SERP API (main engine)
    enabled: true
    country: "gb"
    pages: 2                     # SERP pages per query - deeper coverage (pay-as-you-go, credits no longer capped)
    search_domains:              # broad queries: LinkedIn + all major UK boards ("overall Google" sweep)
      - "uk.linkedin.com/jobs"
      - "www.reed.co.uk/jobs"
      - "www.totaljobs.com"
      - "www.cv-library.co.uk"
      - "uk.indeed.com"
    top_companies_per_run: 5     # rotating per-company sample for the active sector (DS + DA each)
    company_batch: 5             # careers-sites grouped per Google query (higher = fewer credits, less depth)
    max_queries: 40              # broad market queries (pay-as-you-go, so cover more of the market)
    gov_queries: ["data analyst", "data scientist", "data engineer"]
    civil_service_sectors: ["Government & Public Sector"]   # civilservicejobs site: queries on this sector's run
    nhs_sectors: ["Insurance, Health & Pharma"]             # jobs.nhs.uk site: queries on this sector's run
    linkedin_site: true          # dedicated site:uk.linkedin.com/jobs stream (UK LinkedIn depth)
    indeed_site: true            # dedicated site:uk.indeed.com stream (UK Indeed depth)
    serp_countries:              # per-country LinkedIn SERP streams (Indeed omitted: it noindexes job
                                 # pages so Google can't scrape them). EU priority-1 first, then p2.
      # --- EU priority 1 ---
      - { name: "Ireland",     linkedin: true }
      - { name: "Germany",     linkedin: true }
      - { name: "Netherlands", linkedin: true }
      - { name: "Austria",     linkedin: true }
      - { name: "Denmark",     linkedin: true }
      - { name: "France",      linkedin: true }
      - { name: "Sweden",      linkedin: true }
      - { name: "Finland",     linkedin: true }
      - { name: "Norway",      linkedin: true }
      - { name: "Switzerland", linkedin: true }
      - { name: "Luxembourg",  linkedin: true }
      - { name: "Belgium",     linkedin: true }
      # --- priority 2 (rest of world) ---
      - { name: "Canada",      linkedin: true }
      - { name: "Australia",   linkedin: true }
      - { name: "New Zealand", linkedin: true }
      - { name: "Singapore",   linkedin: true }
      - { name: "Japan",       linkedin: true }
      - { name: "South Korea", linkedin: true }
      - { name: "UAE",         linkedin: true }
    extra_queries:               # broad market queries (3 categories) - run on the daily full/broad run
      # data science
      - "data scientist United Kingdom"
      - "graduate data scientist United Kingdom"
      # ai engineer
      - "AI engineer United Kingdom"
      - "machine learning engineer United Kingdom"
      - "LLM engineer United Kingdom"
      - "generative AI engineer United Kingdom"
      # data analysis
      - "data analyst United Kingdom"
      - "analytics engineer United Kingdom"
      - "business intelligence analyst United Kingdom"
  apify_linkedin:                # cheap STRUCTURED LinkedIn via Apify, filtered by companyName (per-company)
    enabled: false               # OFF - Apify free credits expire after ~12 runs and paid plans are costly.
                                 # We cover companies for free via the expanded ATS layer (careers-page classifier)
                                 # + Bright Data SERP for custom/anti-bot sites. Flip true only to A/B test Apify.
    actor: "valig~linkedin-jobs-scraper"
    title_queries:
      - "data scientist OR machine learning engineer OR AI engineer"
      - "data analyst OR analytics engineer OR business intelligence analyst"
    location: "United Kingdom"
    date_posted: "r604800"       # past 7 days (freshness)
    batch_size: 40               # companies per actor run (LinkedIn companyName filter)
    max_jobs_per_company: 6
    max_batches: 8               # cap actor runs per pipeline run (credit control)
  linkedin:                      # STRUCTURED LinkedIn Jobs via Bright Data Web Scraper API.
    enabled: false               # OFF - the BD Web Scraper product needs account activation ('Customer is
                                 # not active'). Using SERP for LinkedIn instead (works well: 72 top cos/run).
                                 # Flip true only after activating the LinkedIn dataset in Bright Data.
    keywords: ["data scientist", "marketing data scientist", "data analyst", "senior data analyst",
               "analytics engineer", "machine learning engineer", "AI engineer"]
    location: "United Kingdom"
    country: "GB"
    time_range: "Past month"     # freshness (fewer, fresher records = lower cost)
    max_age_days: 30
    max_wait: 480                # seconds to wait for the async scrape (poll)
  indeed:                        # STRUCTURED Indeed Jobs via Bright Data Web Scraper API.
    enabled: false               # OFF - needs BD Web Scraper activation; Indeed now covered via SERP
                                 # (site:uk.indeed.com in search_domains). Flip true after activating the dataset.
    keywords: ["data scientist", "marketing data scientist", "data analyst", "senior data analyst",
               "analytics engineer", "machine learning engineer", "AI engineer"]
    location: "United Kingdom"
    country: "GB"
    domain: "indeed.co.uk"
    date_posted: "Last 7 days"
    max_age_days: 30
    max_wait: 480

cleanup:                         # one-time / ongoing housekeeping, runs every pass (idempotent)
  purge_sources: ["Apify"]       # delete rows from retired sources (old 'Google (Apify)' rows)

bucket_list:
  path: "data/companies_master.csv"       # 1165 target companies across 7 sectors (Master List)

rotation:                        # one sector per scheduled run; all 7 covered once/day with time gaps
  enabled: true
  sectors:                       # the 7 Master-List sectors (the daily run covers ALL of them at once)
    - "Financial Services"
    - "Technology & Telecoms"
    - "Consulting & IT Services"
    - "Retail, Consumer & Media"
    - "Insurance, Health & Pharma"
    - "Energy, Transport & Industrial"
    - "Government & Public Sector"
  schedule_hours_utc: [7, 9, 11, 13, 15, 17, 19]   # `--sector auto` maps the current UTC hour -> sector
  broad_hour_utc: 5              # a dedicated daily FULL/broad run (all sources, no sector focus) at this hour
  broad_on_index: -1             # -1 = no sector run does the broad sweep (only the dedicated full run does)

llm:
  # PROVIDERS (Groq retired 2026-08): OpenAI GPT-5.6 + DeepSeek v4 + Gemini 2.5 Pro, routed PER
  # WORKLOAD so each task gets the right cost/quality tier and quotas never collide. Each task falls
  # back through the other providers if its own has no key or errors.
  # ⚠️ Confirm the exact model-ID strings against each provider's API docs and edit below if a name
  #    differs — the client passes these strings straight through.
  primary: "gemini"              # general fallback provider (Gemini 2.5 Pro)
  critic: ""                     # "" = off
  # THREE premium models, THREE distinct jobs (all actively used every run, none idle):
  # --- 1) bulk fit-scoring (every job): DeepSeek v4-flash — cheapest + fastest at high volume ---
  score_provider: "deepseek"
  score_model: "deepseek-v4-flash"
  # --- 2) consensus verify on high-fit picks: GEMINI 2.5 PRO — a genuine second opinion from a
  #        different lab; keeps the lower score + ORs ghost flags (conservative). This is what puts
  #        Gemini to real work instead of leaving it as an idle fallback. ---
  verify_provider: "gemini"
  verify_model: "gemini-2.5-pro"
  # --- 3) deep ATS keyword audit + cover letter for top picks: OpenAI GPT-5.6-terra (best reasoning) ---
  tailor_provider: "openai"
  tailor_model: "gpt-5.6-terra"
  # escalation model for big score disagreements (optional; used via verify fallback)
  escalate_model: "deepseek-v4-pro"
  # --- layered fit-score rescue models (see scoring.rescue_* thresholds) ---
  rescue_l2_provider: "openai"       # Layer 2: re-checks every job under 85
  rescue_l2_model: "gpt-5.6-sol"     # fast/cheap OpenAI tier (high volume, so cheap tier)
  rescue_l3_provider: "gemini"       # Layer 3: re-checks any still under 60
  rescue_l3_model: "gemini-2.5-pro"  # strongest reasoning for the toughest low scores
  # default per-provider models (used when a task falls back to that provider)
  gemini_model: "gemini-2.5-pro"
  openai_model: "gpt-5.6-luna"
  deepseek_model: "deepseek-v4-flash"
  # heavier variants available for harder batches / manual routing
  deepseek_pro_model: "deepseek-v4-pro"
  openai_fast_model: "gpt-5.6-sol"     # lightweight OpenAI tier (fast/cheap classification)
  openai_deep_model: "gpt-5.6-terra"   # heaviest OpenAI tier (deepest reasoning)
  request_delay_seconds: 2.5
  # NOTE on the GPT-5.6 tiers: assumed sol = light/fast, luna = balanced, terra = deep/flagship.
  # If your provider orders them differently, just swap the model strings above.

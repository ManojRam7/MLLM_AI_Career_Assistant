name: Job Search (per-source)

# Run ONE section of the search on its own cadence with its own fit threshold.
# Trigger manually (Actions tab or the web app button), or enable the schedules below.
#
#   sources: reed | adzuna | ats | brightdata | linkedin | indeed  (comma-separated for several)
#   min_fit: alert threshold for THIS run
#
# Your existing full daily pipeline is untouched — this is for targeted, cheaper runs.

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Which sources to run (comma-separated)"
        required: true
        default: "ats"
      sector:
        description: "Sector focus: a sector name, 'auto', 'full', or 'all'"
        required: false
        default: "full"
      min_fit:
        description: "Minimum fit score for alerts on this run"
        required: false
        default: "75"
      mode:
        description: "recurring (rolling window) or first (deeper backfill)"
        type: choice
        options: ["recurring", "first"]
        default: "recurring"

  # ---- Per-section schedules. All OFF until you're happy; uncomment what you want. ----
  # schedule:
  #   - cron: "0 6 * * *"    # ATS boards, daily 06:00 UTC   -> set sources=ats   (see matrix note below)
  #   - cron: "0 7 * * *"    # Adzuna (multi-country), daily
  #   - cron: "0 9 * * 1-5"  # Bright Data SERP, weekdays
  # NOTE: cron triggers can't pass inputs, so scheduled runs use the `defaults` below.

concurrency:
  group: job-search-${{ github.event.inputs.sources || 'scheduled' }}
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run search
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_SERP_ZONE: ${{ secrets.BRIGHTDATA_SERP_ZONE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAPI_KEY: ${{ secrets.OPENAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SOURCES="${{ inputs.sources || 'ats' }}"
          SECTOR="${{ inputs.sector || 'full' }}"
          MINFIT="${{ inputs.min_fit || '75' }}"
          MODE="${{ inputs.mode || 'recurring' }}"
          echo "sources=$SOURCES sector=$SECTOR min_fit=$MINFIT mode=$MODE"
          python scripts/run_pipeline.py --mode "$MODE" --sector "$SECTOR" \
                 --sources "$SOURCES" --min-fit "$MINFIT"

# COMMON APPLICATION QUESTIONS answered in Manoj's voice. The agent matches loosely and can adapt
# the wording to the specific company (fill in the company name where relevant).
question_bank:
  - q: "Why do you want to work here / for this company?"
    a: >
      I'm drawn to the company's use of data to drive real commercial decisions, which is where I've
      focused for the last 4 years. My MMM, pricing and analytics-engineering experience maps closely
      to the role, and I'm keen to contribute quickly while growing with a strong data team.
  - q: "Why are you a good fit for this role?"
    a: >
      I bring 4+ years turning messy commercial data into decisions — MMM and trade-promotion
      optimisation, forecasting, segmentation and risk analytics — on Python/SQL/PySpark/Azure with
      Power BI/Tableau, plus recent GenAI/RAG project work. I own problems end to end, from data to
      deployed model to stakeholder story.
  - q: "What are your strengths?"
    a: "Commercial/marketing analytics (MMM, pricing), end-to-end delivery on Azure, and translating models into clear decisions for non-technical stakeholders."
  - q: "What is your biggest weakness / area to develop?"
    a: "I'm deepening large-scale cloud data-warehousing beyond Azure (BigQuery/Snowflake); I pick up new tools fast and am actively learning."
  - q: "Describe a project you're proud of."
    a: >
      Marketing Mix Modelling + trade-promotion optimisation for a $1B+ US confectionery portfolio:
      I built log-log elasticity models in PySpark/Databricks and an optimisation that improved
      trade-spend efficiency by ~8%, then delivered it to commercial teams via Power BI.
  - q: "Where do you see yourself in a few years?"
    a: "Growing into a senior data scientist / analytics leader, deep in commercial and marketing-science modelling while mentoring others."
  - q: "Are you authorised to work in the UK?"
    a: "Yes — I hold a UK Graduate visa and can work now without sponsorship."
  - q: "Do you require visa sponsorship?"
    a: "Not for UK roles now (Graduate visa). For non-UK roles I would need sponsorship."
  - q: "What are your salary expectations?"
    a: "Around £45,000, flexible on the overall package and the role."
  - q: "When can you start / notice period?"
    a: "About one month; I can be flexible."
  - q: "Cover letter / anything else you'd like us to know?"
    a: >
      I'm a data scientist with 4+ years in commercial analytics (MMM, pricing, forecasting,
      segmentation) plus recent GenAI/RAG work, an MSc Data Science (Distinction) and Microsoft
      certifications. I'd bring immediate, hands-on value and am excited about this role.

# HOW TO WRITE open-ended answers (tone the agent should imitate):
voice: >
  First person, warm but professional, concise (2-4 sentences unless more is asked). UK spelling,
  no em-dashes, no buzzword-stuffing. Always grounded in the real experience above — never invent
  tools, employers, figures or qualifications. If a question asks about something I lack, be honest
  and pivot to the closest real, transferable experience.
